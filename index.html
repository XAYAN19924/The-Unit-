<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Unit • Infinity Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">DISCORD ACTIVITY</div>
        <h1>The Unit</h1>
        <div class="subtitle">INFINITY CLICKER</div>
      </div>
      <div class="session">
        <span class="dot"></span>
        <span id="sessionCount">1</span> player(s) in session
      </div>
    </header>

    <section class="game">
      <aside class="menu panel">
        <h2>Progression</h2>
        <button class="tab active" data-tab="upgrades"><span>⚡</span><b>Upgrades</b><small>Boost your click power</small></button>
        <button class="tab" data-tab="rebirth"><span>↻</span><b>Rebirth</b><small>Reset for permanent power</small></button>
        <button class="tab" data-tab="ultrarebirth"><span>✦</span><b>Ultra Rebirth</b><small>Reach the next layer</small></button>
        <button class="tab" data-tab="prestige"><span>◆</span><b>Prestige</b><small>Reset everything for prestige</small></button>
        <div class="menu-footer">
          <div><span>Multiplier</span><strong id="multiplier">x1</strong></div>
          <div><span>Rebirths</span><strong id="rebirthCount">0</strong></div>
          <div><span>Ultra Rebirths</span><strong id="ultraCount">0</strong></div>
          <div><span>Prestige</span><strong id="prestigeCount">0</strong></div>
        </div>
      </aside>

      <section class="clicker panel">
        <div class="score-label">YOUR CLICKS</div>
        <div id="score" class="score">0</div>
        <button id="clickButton" aria-label="Click">
          <span>CLICK</span>
          <small>+<b id="clickPower">1</b> PER CLICK</small>
        </button>
        <div class="cps-box">
          <span>CPS</span>
          <strong id="cps">0.0</strong>
        </div>
        <div id="hint" class="hint">Each click adds power to your score.</div>

        <div id="tabPanel" class="tab-panel">
          <div id="upgradesTab" class="tab-content active"></div>
          <div id="rebirthTab" class="tab-content"></div>
          <div id="ultrarebirthTab" class="tab-content"></div>
          <div id="prestigeTab" class="tab-content"></div>
        </div>
      </section>

      <aside class="leaderboard panel">
        <div class="leader-head">
          <h2>Leaderboard</h2>
          <span id="syncStatus" class="sync offline">LOCAL</span>
        </div>
        <p class="leader-sub">Discord display names • live session</p>
        <ol id="leaderboard"></ol>
      </aside>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
