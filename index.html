<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Unit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">DISCORD ACTIVITY</div>
        <h1>The Unit</h1>
      </div>
      <div class="session">
        <span class="dot"></span>
        <span id="sessionCount">1</span> gracz(e) w sesji
      </div>
    </header>

    <section class="game">
      <aside class="players panel">
        <h2>Gracze</h2>
        <div id="players"></div>
      </aside>

      <section class="clicker panel">
        <div class="score-label">TWÓJ WYNIK</div>
        <div id="score" class="score">0</div>
        <button id="clickButton" aria-label="Kliknij">
          <span>UNIT</span>
          <small>KLIKNIJ</small>
        </button>
        <div class="hint">Każde kliknięcie +1</div>
      </section>

      <aside class="leaderboard panel">
        <h2>Ranking</h2>
        <ol id="leaderboard"></ol>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
